// claude.ai 아티팩트 환경에서는 플랫폼이 window.storage를 자동으로 만들어주지만,
// 독립된 웹앱(Vercel)에는 그런 게 없으므로 여기서 같은 모양(.get/.set, 반환값 {value:...})으로
// 직접 만들어줍니다. 아래부터의 화면 코드는 v49 그대로이며 한 줄도 손대지 않았습니다 -
// 저장 방식만 "Claude 내부 저장소" → "이 웹앱의 /api/state(서버) → Vercel KV(데이터베이스)"로
// 바뀐 것뿐이라, 기존에 검증된 화면 동작(충전 시작/종료/예약 등)은 전혀 영향받지 않습니다.
window.storage = {
  get: function(key){
    return fetch('/api/state?key=' + encodeURIComponent(key), { cache: 'no-store' })
      .then(function(res){
        if(!res.ok) throw new Error('불러오기 실패: HTTP ' + res.status);
        return res.json();
      })
      .then(function(data){ return { value: (data && data.value != null) ? data.value : null }; });
  },
  set: function(key, value){
    return fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key, value: value })
    }).then(function(res){
      if(!res.ok) throw new Error('저장 실패: HTTP ' + res.status);
      return true;
    });
  }
};

function staffOrgSortValue(name){
  var idx = STAFF_ORG_ORDER_INDEX[name];

function deptSortValue(name){
  var idx = DEPT_DISPLAY_ORDER.indexOf(name);
  return idx===-1 ? 100000 : idx;
}
var DEFAULT_PHONE_FORMAT = {prefix:'031-270-9', digits:3};
function formatExt(ext, format){
  if(!ext) return '';
  var f = format || DEFAULT_PHONE_FORMAT;
  return (f.prefix!==undefined ? f.prefix : DEFAULT_PHONE_FORMAT.prefix) + ext;
}
function extPhone(ext){ return formatExt(ext, (state && state.staffPhoneFormat) || DEFAULT_PHONE_FORMAT); }
function lookupExtInRoster(roster, name, format){
  if(!name || !roster) return '';
  var q = name.trim();
  var hit = roster.filter(function(r){ return r.name===q; })[0];
  return hit ? formatExt(hit.ext, format || DEFAULT_PHONE_FORMAT) : '';
}
function lookupExt(name){ return lookupExtInRoster(state && state.staffRoster, name, state && state.staffPhoneFormat); }
function searchRoster(roster, query, limit){
  var q = (query||'').trim();
  if(!q || !roster) return [];
  var starts = [], includes = [];
  roster.forEach(function(r){
    if(r.name===q) return; // 이미 완전히 일치하면 추천 목록에 또 보여줄 필요 없음
    if(r.name.indexOf(q)===0) starts.push(r);
    else if(r.name.indexOf(q)>-1) includes.push(r);
  });
  return starts.concat(includes).slice(0, limit||6);
}
function deptOptionsHtml(state, selected, includeBlank){
  var depts = ((state && state.depts) || []).slice().sort(function(a,b){
    var cmp = deptSortValue(a) - deptSortValue(b);
    return cmp!==0 ? cmp : a.localeCompare(b,'ko',{numeric:true});
  });
  var blank = includeBlank===false ? '' : '<option value="">선택하세요</option>';
  return blank + depts.map(function(d){
    return '<option value="'+escapeHtml(d)+'"'+(d===selected?' selected':'')+'>'+escapeHtml(d)+'</option>';
  }).join('');
}
function plateOptionsHtml(state, dept, selected){
  if(!dept) return '<option value="">부를 먼저 선택하세요</option>';
  var list = ((state && state.vehicles) || []).filter(function(v){ return v.dept===dept; });
  if(!list.length) return '<option value="">등록된 차량이 없습니다</option>';
  return '<option value="">선택하세요</option>' + list.map(function(v){
    return '<option value="'+escapeHtml(v.plate)+'"'+(v.plate===selected?' selected':'')+'>'+escapeHtml(v.plate)+' · '+escapeHtml(v.model||'')+'</option>';
  }).join('');
}
function syncPlateOptions(deptSelectId, plateSelectId){

  plateSel.innerHTML = plateOptionsHtml(state, deptSel.value, '');

function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function cloneState(s){ return JSON.parse(JSON.stringify(s)); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function nowISO(){ return new Date().toISOString(); }
function fmtClock(iso){ return new Date(iso).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}); }
function fmtMinutes(m){ if(m<60) return m+'분'; if(m%60===0) return (m/60)+'시간'; return Math.floor(m/60)+'시간 '+(m%60)+'분'; }
var FAST_MINUTES_PRESET = [30,60,90,120,180,240];
var SLOW_MINUTES_PRESET = [30,60,90,120,180,240,300,360,420,480,540,600];
function minutesOptionsHtml(type, selected){
  var opts = (type==='slow') ? SLOW_MINUTES_PRESET : FAST_MINUTES_PRESET;
  var html = '<option value="custom"'+(selected==='custom'?' selected':'')+'>직접 입력...</option>';
  html += opts.map(function(m){ return '<option value="'+m+'"'+(m===selected?' selected':'')+'>'+fmtMinutes(m)+'</option>'; }).join('');
  return html;
}
function chargerMaxMinutes(chargerId){
  var meta = state && state.chargerMeta ? state.chargerMeta[chargerId] : null;
  return (meta && meta.type==='slow') ? 600 : 240;
}
function toggleStartMinutesCustom(){
  var sel = document.getElementById('startMinutes'); var wrap = document.getElementById('startMinutesCustomWrap');
  if(!sel || !wrap) return;
  wrap.hidden = (sel.value !== 'custom');
}
function statusLabel(st){ return st==='idle'?'비어있음':(st==='charging'?'충전중':'점검중'); }

var ACTION_LABEL = {start:'충전 시작', end:'충전 종료', reserve:'예약', cancel_reserve:'예약 취소', maintenance_on:'점검 시작', maintenance_off:'점검 해제'};

function pushHistory(state, chargerId, action, fields, text){
  var meta = (state.chargerMeta||{})[chargerId];
  fields = fields || {};
  state.history.unshift({
    id:uid(), time:nowISO(), chargerId:chargerId, chargerName: meta?meta.name:'',
    action:action, name:fields.name||'', dept:fields.dept||'', plate:fields.plate||'', text:text
  });
  if(state.history.length>500) state.history.length = 500;
}

function findQueueConflict(chargerId, minutes){
  var c = state.chargers[chargerId];
  if(!c || !c.queue || !c.queue.length) return null;
  var end = new Date(Date.now()+minutes*60000);
  var conflict = null;
  c.queue.forEach(function(q){
    var from = new Date(q.from);
    if(from < end && (!conflict || from < new Date(conflict.from))) conflict = q;
  });
  return conflict;
}
function doStart(state, chargerId, data){
  var s = cloneState(state); var c = s.chargers[chargerId];
  var start = nowISO(); var end = new Date(Date.now()+data.minutes*60000).toISOString();
  c.status='charging'; c.current={name:data.name, dept:data.dept||'', plate:data.plate, ext:lookupExtInRoster(s.staffRoster, data.name, s.staffPhoneFormat), startedAt:start, expectedEnd:end, minutes:data.minutes};
  pushHistory(s, chargerId, 'start', {name:data.name, dept:data.dept, plate:data.plate}, data.name+(data.dept?(' · '+data.dept):'')+' 님이 충전을 시작했습니다 ('+data.plate+', 예상 '+fmtMinutes(data.minutes)+')');
  return s;
}
function doEnd(state, chargerId){
  var s = cloneState(state); var c = s.chargers[chargerId];
  var prevCur = c.current;
  var who = prevCur ? prevCur.name : '알 수 없음';
  c.status='idle'; c.current=null;
  pushHistory(s, chargerId, 'end', {name:who, dept:prevCur?prevCur.dept:'', plate:prevCur?prevCur.plate:''}, who+' 님이 충전을 종료했습니다');
  return s;
}
function doReserve(state, chargerId, data){
  var s = cloneState(state); var c = s.chargers[chargerId];
  c.queue.push({id:uid(), name:data.name, dept:data.dept||'', plate:data.plate, ext:lookupExtInRoster(s.staffRoster, data.name, s.staffPhoneFormat), from:data.from, to:data.to});
  c.queue.sort(function(a,b){ return a.from.localeCompare(b.from); });
  pushHistory(s, chargerId, 'reserve', {name:data.name, dept:data.dept, plate:data.plate}, data.name+' 님이 '+fmtClock(data.from)+'~'+fmtClock(data.to)+' 예약했습니다');
  return s;
}
function doCancelReserve(state, chargerId, reservationId){
  var s = cloneState(state); var c = s.chargers[chargerId];
  var item = null;
  c.queue = c.queue.filter(function(q){ if(q.id===reservationId){ item=q; return false;} return true; });
  if(item) pushHistory(s, chargerId, 'cancel_reserve', {name:item.name, dept:item.dept, plate:item.plate}, item.name+' 님의 예약이 취소되었습니다');
  return s;
}
function doStartFromReserve(state, chargerId, reservationId){
  var c = state.chargers[chargerId];
  if(!c) return {error:'충전기 정보를 찾을 수 없어요.'};
  if(c.status!=='idle') return {error:'지금은 이 충전기가 비어있지 않아 예약을 바로 충전으로 전환할 수 없어요.'};
  var item = (c.queue||[]).filter(function(q){ return q.id===reservationId; })[0];
  if(!item) return {error:'예약 정보를 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.'};
  var minutes = Math.max(5, Math.round((new Date(item.to).getTime()-new Date(item.from).getTime())/60000));
  var s = doStart(state, chargerId, {name:item.name, dept:item.dept, plate:item.plate, minutes:minutes});
  s.history[0].text += ' (예약을 충전으로 전환)';
  s.chargers[chargerId].queue = (s.chargers[chargerId].queue||[]).filter(function(q){ return q.id!==reservationId; });
  return {state:s};
}
function doMaintOn(state, chargerId, note){
  var s = cloneState(state); var c = s.chargers[chargerId];
  var hadSession = !!c.current;
  c.status='maintenance'; c.current=null; c.note = note||'';
  pushHistory(s, chargerId, 'maintenance_on', {}, '점검중으로 표시되었습니다'+(note?(' · '+note):'')+(hadSession?' (진행 중이던 충전은 종료 처리됨)':''));
  return s;
}
function doMaintOff(state, chargerId){
  var s = cloneState(state); var c = s.chargers[chargerId];
  c.status='idle'; c.note=null;
  pushHistory(s, chargerId, 'maintenance_off', {}, '점검이 완료되어 사용 가능으로 전환되었습니다');
  return s;
}

var MASCOT_CHAR_HTML = '<img src="'+MASCOT_IMG_URL+'" alt="충전 중인 방울이 캐릭터" draggable="false">';
var DROP_ICON_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s7 7.58 7 12a7 7 0 0 1-14 0c0-4.42 7-12 7-12Z"/></svg>';

function sectionTitleHtml(text){
  return '<span class="section-title-icon">'+DROP_ICON_SMALL_SVG+'</span><span>'+text+'</span>';
}
function renderChip(icon, label, value){ return '<div class="chip"><span class="chip-icon">'+icon+'</span><div class="chip-text"><b>'+value+'</b><span>'+label+'</span></div></div>'; }
function renderSummary(state){
  var chargerOrder = state.chargerOrder||[];
  var fastIds = chargerOrder.filter(function(id){ return state.chargerMeta[id].type==='fast'; });
  var slowIds = chargerOrder.filter(function(id){ return state.chargerMeta[id].type==='slow'; });
  var fastBusy = fastIds.filter(function(id){ return state.chargers[id].status==='charging'; }).length;
  var slowBusy = slowIds.filter(function(id){ return state.chargers[id].status==='charging'; }).length;
  var totalQueue = chargerOrder.reduce(function(n,id){ return n+state.chargers[id].queue.length; },0);
  return renderChip(BOLT_ICON_SVG, '급속 사용중', fastBusy+' / '+fastIds.length)+renderChip(PLUG_ICON_SVG, '완속 사용중', slowBusy+' / '+slowIds.length)+renderChip(QUEUE_ICON_SVG, '대기 예약', totalQueue+'건');
}
function renderRemain(cur){
  var end = new Date(cur.expectedEnd).getTime(); var start = new Date(cur.startedAt).getTime(); var now = Date.now();
  var total = Math.max(end-start,1); var elapsed = Math.min(Math.max(now-start,0), total*1.6);
  var pct = Math.min(100, Math.round(elapsed/total*100));
  var mascotPct = Math.min(96, Math.max(4, pct)); // 캐릭터가 트랙 양끝 밖으로 잘려나가지 않도록 살짝 여유를 둠
  var diffMin = Math.round((end-now)/60000); var overdue = diffMin<0;
  var text = overdue ? ('예상 시간이 '+Math.abs(diffMin)+'분 지났습니다') : (diffMin<=0 ? '곧 완료 예정' : ('약 '+diffMin+'분 남음'));
  return '<div class="mascot-progress">'
    +'<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
    +'<div class="mascot-car" style="left:'+mascotPct+'%">'+MASCOT_CHAR_HTML+'</div>'
    +'</div>'
    +'<div class="remain'+(overdue?' overdue':'')+'"><span>'+fmtClock(cur.startedAt)+' 시작</span><span>'+text+'</span></div>';
}
function renderQueue(chargerId, queue, writable, chargerStatus){
  if(!queue.length) return '<div class="queue"><div class="queue-title">예약 대기열</div><div class="queue-empty">예약이 없습니다</div></div>';
  var canStart = writable && chargerStatus==='idle';
  var rows = queue.map(function(q){
    var actions = (canStart?('<button class="btn small primary" data-action="start-from-reserve" data-charger="'+chargerId+'" data-id="'+q.id+'">지금 시작</button>'):'')
      +(writable?('<button class="btn small ghost" data-action="cancel-reserve" data-charger="'+chargerId+'" data-id="'+q.id+'">취소</button>'):'');
    return '<div class="queue-item"><span class="who">'+escapeHtml(q.name)+(q.dept?(' · '+escapeHtml(q.dept)):'')+(q.ext?(' · <span class="phone">'+escapeHtml(q.ext)+'</span>'):'')+'</span>'
      +'<span class="when">'+fmtClock(q.from)+'–'+fmtClock(q.to)+'</span>'
      +(actions?('<div class="queue-actions">'+actions+'</div>'):'')
      +'</div>';
  }).join('');
  return '<div class="queue"><div class="queue-title">예약 대기열 <span>'+queue.length+'건</span></div>'+rows+'</div>';
}
function renderCard(chargerId, c, writable, meta){
  var body='';
  var dis = writable?'':'disabled';
  if(c.status==='idle'){
    body = '<div class="idle-msg">현재 비어 있어요. 바로 충전을 시작할 수 있습니다.</div>'
      +'<div class="btn-row"><button class="btn primary" data-action="open-start" data-charger="'+chargerId+'" '+dis+'>충전 시작</button>'
      +'<button class="btn" data-action="open-reserve" data-charger="'+chargerId+'" '+dis+'>예약하기</button>'
      +'<button class="btn ghost" data-action="open-maint" data-charger="'+chargerId+'" '+dis+'>점검중으로 표시</button></div>';
  } else if(c.status==='charging'){
    var cur = c.current;
    body = '<div class="session">'
      +'<div class="session-row"><span class="k">사용자</span><span class="v">'+escapeHtml(cur.name)+(cur.dept?(' · '+escapeHtml(cur.dept)):'')+(cur.ext?(' · <span class="phone">'+escapeHtml(cur.ext)+'</span>'):'')+'</span></div>'
      +'<div class="session-row"><span class="k">차량번호</span><span class="v">'+escapeHtml(cur.plate)+'</span></div>'
      +'<div class="session-row"><span class="k">예상 종료</span><span class="v">'+fmtClock(cur.expectedEnd)+'</span></div>'
      +renderRemain(cur)+'</div>'
      +'<div class="btn-row"><button class="btn primary" data-action="end-charging" data-charger="'+chargerId+'" '+dis+'>충전 종료</button>'
      +'<button class="btn ghost" data-action="open-reserve" data-charger="'+chargerId+'" '+dis+'>다음 예약 추가</button></div>';
  } else {
    body = '<div class="maint-note">점검중입니다.'+(c.note?(' · '+escapeHtml(c.note)):'')+'</div>'

function localDateKey(d){ return d.toLocaleDateString('sv-SE'); }
function computeDailyUsage(state, days){
  var now = new Date();
  var keys = [], counts = {};
  for(var i=days-1;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    var k = localDateKey(d);
    keys.push(k); counts[k] = 0;
  }
  (state.history||[]).forEach(function(h){
    if(h.action!=='start') return;
    var k = localDateKey(new Date(h.time));
    if(counts.hasOwnProperty(k)) counts[k]++;
  });
  return keys.map(function(k){ return {date:k, count:counts[k]}; });
}
function computeChargerUsage(state, days){
  var cutoff = Date.now() - days*86400000;
  var counts = {};
  var chargerOrder = state.chargerOrder||[];
  chargerOrder.forEach(function(id){ counts[id]=0; });
  (state.history||[]).forEach(function(h){
    if(h.action!=='start') return;
    if(new Date(h.time).getTime() < cutoff) return;
    if(counts.hasOwnProperty(h.chargerId)) counts[h.chargerId]++;
  });
  return chargerOrder.map(function(id){ return {id:id, name:state.chargerMeta[id].name, count:counts[id]}; });
}
function roundedTopBarPath(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w/2, h));
  if(h<=0) return '';
  if(r<=0.01){
    return 'M'+x+','+(y+h)+' L'+x+','+y+' L'+(x+w)+','+y+' L'+(x+w)+','+(y+h)+' Z';
  }
  return 'M'+x+','+(y+h)
    +' L'+x+','+(y+r)
    +' Q'+x+','+y+' '+(x+r)+','+y
    +' L'+(x+w-r)+','+y
    +' Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)
    +' L'+(x+w)+','+(y+h)+' Z';
}
function renderDailyBarChart(data){
  var counts = data.map(function(d){ return d.count; });
  var max = Math.max.apply(null, counts);
  var maxSafe = max>0 ? max : 1;
  var w=300, h=132, padL=4, padR=4, padT=16, padB=20;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  var n=data.length, gap=1.2;
  var band=innerW/n;
  var barW=Math.max(1.6, Math.min(10, band-gap));
  var baseline=padT+innerH;
  var bars = data.map(function(d,i){
    var x = padL+i*band+(band-barW)/2;
    var bh = max>0 ? (d.count/maxSafe)*(innerH-4) : 0;
    var y = baseline-bh;
    var path = roundedTopBarPath(x, y, barW, bh, Math.min(3, barW/2));
    if(!path) return '';
    var title = d.date+' · '+d.count+'건';
    return '<path d="'+path+'" fill="var(--viz-cat-1)"><title>'+escapeHtml(title)+'</title></path>';
  }).join('');
  var step = Math.max(1, Math.round(n/6));
  var labelIdxs = [];
  for(var i=0;i<n;i+=step) labelIdxs.push(i);
  if(labelIdxs[labelIdxs.length-1]!==n-1) labelIdxs.push(n-1);
  var labels = labelIdxs.map(function(i){
    var parts = data[i].date.split('-');
    var short = parts[1]+'/'+parts[2];
    var x = padL+i*band+band/2;
    return '<text class="bar-label" x="'+x.toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle">'+short+'</text>';
  }).join('');
  var maxLabel = max>0 ? '<text class="value-label" x="'+padL+'" y="'+(padT-5)+'">최대 '+max+'건</text>' : '';
  var gridline = '<line class="axis-line" x1="'+padL+'" y1="'+baseline+'" x2="'+(w-padR)+'" y2="'+baseline+'"/>';
  return '<svg class="bar-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="일별 충전 시작 건수, 최근 '+n+'일">'
    +gridline+bars+labels+maxLabel+'</svg>';
}
function renderChargerBarChart(data){
  var counts = data.map(function(d){ return d.count; });
  var max = Math.max.apply(null, counts);
  var maxSafe = max>0 ? max : 1;
  var w=300, h=150, padL=10, padR=10, padT=24, padB=26;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  var n=data.length;
  var band=innerW/n;
  var barW=Math.min(46, band-16);
  var baseline=padT+innerH;
  var colors=['var(--viz-cat-1)','var(--viz-cat-2)','var(--viz-cat-3)'];
  var bars = data.map(function(d,i){
    var bh = max>0 ? (d.count/maxSafe)*(innerH-6) : 0;
    var x = padL+i*band+(band-barW)/2;
    var y = baseline-bh;
    var color = colors[i%colors.length];
    var path = roundedTopBarPath(x, y, barW, bh, 4);
    var shortName = d.name.replace('충전기 ','');
    var labelY = bh>=16 ? (y-6) : Math.max(y-6, padT-6);
    var valueLabel = '<text class="value-label" x="'+(x+barW/2).toFixed(1)+'" y="'+labelY+'" text-anchor="middle">'+d.count+'</text>';
    var nameLabel = '<text class="bar-label" x="'+(x+barW/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+escapeHtml(shortName)+'</text>';
    var rect = path ? '<path d="'+path+'" fill="'+color+'"><title>'+escapeHtml(d.name+' · '+d.count+'건')+'</title></path>' : '';
    return rect+valueLabel+nameLabel;
  }).join('');
  var gridline='<line class="axis-line" x1="'+padL+'" y1="'+baseline+'" x2="'+(w-padR)+'" y2="'+baseline+'"/>';
  return '<svg class="bar-chart" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="충전기별 충전 시작 건수, 최근 30일">'+gridline+bars+'</svg>';
}

function csvEscape(v){
  var s = String(v==null?'':v);
  if(/[",\n\r]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function buildCsv(header, rows){
  var lines = [header].concat(rows).map(function(r){ return r.map(csvEscape).join(','); });
  return '\uFEFF' + lines.join('\r\n');
}
function downloadTextFile(filename, text, mime){
  try{
    var blob = new Blob([text], {type:(mime||'text/csv')+';charset=utf-8;'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    return true;
  }catch(err){ return false; }
}
// 아주 단순한 CSV 파서. 큰따옴표로 감싼 필드(콤마/줄바꿈/큰따옴표 포함 가능)를 지원한다.
function parseCsv(text){
  text = text.replace(/^\uFEFF/, ''); // BOM 제거
  var rows = [], row = [], field = '', inQuotes = false;
  for(var i=0;i<text.length;i++){
    var c = text[i], next = text[i+1];
    if(inQuotes){
      if(c==='"' && next==='"'){ field+='"'; i++; }
      else if(c==='"'){ inQuotes=false; }
      else { field+=c; }
    } else {
      if(c==='"'){ inQuotes=true; }
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\r'){ /* skip, \n이 줄바꿈 처리 */ }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field+=c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(function(r){ return !(r.length===1 && r[0].trim()===''); });
}

function parseVehiclesCsvRows(rows, state){

  var out = [], errs = [];
  body.forEach(function(r, i){
    var dept = (r[0]||'').trim(), plate = (r[1]||'').trim(), model = (r[2]||'').trim();

    out.push({dept:dept, plate:plate, model:model});
  });
  if(errs.length) return {error:'업로드한 파일에서 문제를 찾았어요:\n'+errs.slice(0,8).join('\n')+(errs.length>8?'\n...외 '+(errs.length-8)+'건':'')};
  if(!out.length) return {error:'등록할 수 있는 차량 정보가 없어요.'};

}

function parseStaffCsvRows(rows, state){
  if(!rows.length) return {error:'파일에 내용이 없어요.'};
  var body = rows.slice(1);
  var fmt = state.staffPhoneFormat || DEFAULT_PHONE_FORMAT;
  var extRe = new RegExp('^[0-9]{'+fmt.digits+'}$');
  var out = [], errs = [], seen = {};
  body.forEach(function(r, i){
    var dept = (r[0]||'').trim(), name = (r[1]||'').trim(), ext = (r[2]||'').trim();
    if(!dept && !name && !ext) return;
    if(!name || !ext){ errs.push((i+2)+'번째 줄: 이름과 구내번호는 비어있을 수 없어요.'); return; }
    if(!extRe.test(ext)){ errs.push((i+2)+'번째 줄: 구내번호는 숫자 '+fmt.digits+'자리여야 해요. ("'+ext+'")'); return; }
    if(seen[name]){ errs.push((i+2)+'번째 줄: "'+name+'" 이름이 파일 안에서 중복돼요.'); return; }
    seen[name] = true;
    out.push({dept:dept, name:name, ext:ext});
  });
  if(errs.length) return {error:'업로드한 파일에서 문제를 찾았어요:\n'+errs.slice(0,8).join('\n')+(errs.length>8?'\n...외 '+(errs.length-8)+'건':'')};

  return {rows:out};
}

      scheduleSaveVerification(json);

    }catch(err){
      lastErr = err;

      diagLog('save-fail', (attempt+1)+'회차 시도: '+((err && (err.message||String(err)))||''));

        // 저장이 성공했다고 응답을 받았는데, 1.5초 뒤 다시 읽어보니 그 값이 실제로 없음 -
        // 저장이 진짜로는 반영되지 않고 있다는 강한 신호. 사용자가 그 순간 알아챌 수 있게
        // 사라지지 않는 배지로 계속 표시(단, 이미 다른 저장이 그 사이 더 진행됐을 수도 있으니
        // 방금 확인하려던 값과 현재 lastSavedJson이 다르면 - 즉 그 사이 새로운 저장이 있었으면 - 무시).
        if(lastSavedJson === expectedJson){
          lastSyncOK = false;
          lastSyncAt = Date.now();
          lastSyncDetail = '저장 완료 응답 후 재확인 결과 실제로 반영되지 않음';
          updateSyncBadge();
          diagLog('verify-mismatch', '저장 1.5초 후 재확인 결과 불일치(값 없음 또는 다른 값)');
        }
      } else {
        diagLog('verify-ok', '저장 1.5초 후 재확인 결과 일치');
      }
    }).catch(function(e){ diagLog('verify-error', (e && (e.message||String(e)))||''); /* 검증 자체 실패는 판단 보류 - 배지 상태를 바꾸지 않음 */ });
  }, 1500);
}
async function runAction(newState, msg){
  var prev = state; state = newState; paint(); toast(msg);

  if(!result.ok){
    state = prev; paint();
    var extra = result.detail ? (' ('+result.detail+')') : '';
    toast('저장하지 못했습니다. 다시 시도해 주세요.'+extra);
  }
}

}

}

function onFileChange(e){
  var input = e.target;
  if(!input || !input.classList || !input.classList.contains('csv-file-input')) return;
  var kind = input.dataset.kind;
  var file = input.files && input.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    var text = String(reader.result||'');
    input.value = '';
    var rows;
    try{ rows = parseCsv(text); }
    catch(err){ showBulkDialog('파일을 읽는 중 문제가 발생했어요. CSV 형식이 맞는지 확인해 주세요.', true); return; }
    var result = kind==='vehicles' ? parseVehiclesCsvRows(rows, state) : parseStaffCsvRows(rows, state);
    if(result.error){ showBulkDialog(result.error, true); return; }
    pendingBulkImport = {kind:kind, rows:result.rows};
    var label = kind==='vehicles' ? '차량 목록' : '명부';
    showBulkDialog('선택하신 파일 내용('+result.rows.length+'건)으로 '+label+' 전체를 교체합니다.\n기존에 등록되어 있던 내용은 사라집니다. 계속할까요?', false);
  };
  reader.onerror = function(){ input.value=''; toast('파일을 읽는 중 문제가 발생했어요.'); };
  reader.readAsText(file, 'utf-8');
}

function setupNameAutocomplete(inputId, suggestId, hintId){
  var input = document.getElementById(inputId), panel = document.getElementById(suggestId);
  if(!input || !panel) return;
  input.addEventListener('input', function(){
    updateNameExtHint(inputId, hintId);
    renderNameSuggestions(inputId, suggestId);
  });
  input.addEventListener('focus', function(){ renderNameSuggestions(inputId, suggestId); });
  input.addEventListener('blur', function(){ setTimeout(function(){ panel.hidden = true; }, 150); });
  input.addEventListener('keydown', function(e){ if(e.key==='Escape') panel.hidden = true; });
  panel.addEventListener('mousedown', function(e){ e.preventDefault(); }); // 입력칸 blur보다 클릭이 먼저 처리되게
  panel.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-name]');
    if(!btn) return;
    input.value = btn.dataset.name;
    panel.hidden = true;
    updateNameExtHint(inputId, hintId);
    input.focus();
  });
}
function renderNameSuggestions(inputId, suggestId){
  var input = document.getElementById(inputId), panel = document.getElementById(suggestId);
  if(!input || !panel) return;
  var matches = searchRoster(state.staffRoster, input.value, 6);
  if(!matches.length){ panel.hidden = true; panel.innerHTML=''; return; }
  panel.innerHTML = matches.map(function(r){
    return '<button type="button" data-name="'+escapeHtml(r.name)+'"><span>'+escapeHtml(r.name)+'</span><span class="sug-ext">'+escapeHtml(extPhone(r.ext))+'</span></button>';
  }).join('');
  panel.hidden = false;
}
function updateNameExtHint(inputId, hintId){
  var input = document.getElementById(inputId), hint = document.getElementById(hintId);
  if(!input || !hint) return;
  var ext = lookupExt(input.value);
  hint.textContent = ext ? ('☎ '+ext) : '';
}

function normalizeState(s){

    s.depts = DEFAULT_DEPTS.slice();
    s.vehicles = DEFAULT_VEHICLES.map(function(v){ return {id:uid(), dept:v.dept, plate:v.plate, model:v.model}; });
  }
  if(!s.chargerMeta || !s.chargerOrder){
    s.chargerMeta = JSON.parse(JSON.stringify(DEFAULT_CHARGER_META));
    s.chargerOrder = DEFAULT_CHARGER_ORDER.slice();
  }
  if(!s.staffRoster){
    s.staffRoster = defaultStaffRoster();
  } else {
    // v25 이전에 저장된 명부에는 '구분(과)' 정보가 없을 수 있어, 기본 명부 기준으로 보완해 넣는다.
    var deptByName = {};
    DEFAULT_STAFF_ROSTER.forEach(function(r){ deptByName[r[0]] = r[2]||''; });
    s.staffRoster.forEach(function(r){ if(r.dept===undefined) r.dept = deptByName[r.name] || ''; });
  }
  if(!s.staffPhoneFormat){
    s.staffPhoneFormat = {prefix:DEFAULT_PHONE_FORMAT.prefix, digits:DEFAULT_PHONE_FORMAT.digits};
  }
  return s;
}

    var result = await window.storage.get(STORAGE_KEY, true);
    storageOK = true;
    if(result && result.value){
      if(result.value !== lastSavedJson){
        lastSavedJson = result.value;
        state = normalizeState(JSON.parse(result.value));
        paint();
        diagLog('poll-change', '다른 화면(또는 다른 사람)의 변경 내용을 반영함');
      }
      // v47: 저장소를 정상적으로 읽어왔다는 것 자체가 확인됐으므로, 떠 있던 저장 문제 배지가 있다면 정리.
      if(lastSyncOK === false){
        lastSyncOK = true; lastSyncDetail = ''; lastSyncAt = Date.now(); updateSyncBadge();
        diagLog('poll-recovered', '정상 읽기 확인, 경고 해제');
      } else {
        lastSyncAt = Date.now(); updateSyncBadge();
        // v48: 매 4초마다 폴링이 도는데, 정상일 때마다 매번 기록하면 진단 로그(최근 150건)가
        // 금방 다 차서 정작 필요한 "무슨 일이 있었는지"가 밀려날 수 있음. 그래서 평소엔 5분에
        // 한 번씩만 "정상이었다"는 기준점을 남기고, 실제 이상 징후만 즉시 기록함.
        if(Date.now() - lastDiagHeartbeatAt > 5*60*1000){
          diagLog('poll-heartbeat', '정상 확인');
          lastDiagHeartbeatAt = Date.now();
        }
      }
    } else if(lastSavedJson){
      // v47: 이전에 분명히 저장에 성공했다는 기록(lastSavedJson)이 있는데, 폴링으로 다시 읽어보니
      // 저장소가 비어있음 - 저장했던 데이터가 실제로 사라졌다는 뜻이므로 배지로 알림.
      lastSyncOK = false; lastSyncAt = Date.now();
      lastSyncDetail = '저장했던 데이터가 저장소에서 사라짐(자동 확인 중 발견)';
      updateSyncBadge();
      diagLog('poll-data-missing', '이전에 저장 확인됐던 데이터가 폴링 중 사라진 것을 발견');
    }
  }catch(e){
    // key not found yet, or transient error - ignore, next successful save will populate it
    // (반복될 수 있어 60초에 한 번만 기록해 로그가 금방 차버리지 않게 함)
    if(Date.now() - lastDiagHeartbeatAt > 60*1000 || lastDiagHeartbeatAt===0){
      diagLog('poll-error', (e && (e.message||String(e)))||'');
      lastDiagHeartbeatAt = Date.now();
    }
  }
}
async function init(){
  try{ isAdmin = localStorage.getItem('ev_charger_admin')==='1'; }catch(e){ isAdmin = false; }
  injectStyle(); injectChrome();
  var app = document.getElementById('app');
  if(app) app.innerHTML = '<div style="padding:40px;text-align:center;color:var(--ink-muted);">불러오는 중...</div>';

  if(window.storage){
    // v46: 예전 코드는 window.storage.get()이 어떤 이유로든 실패하면(일시적 네트워크 오류,
    // 저장 직후 읽기 시점의 지연 등) 곧바로 "첫 실행"이라고 단정하고 빈 기본값을 만들어 그 자리에서
    // 다시 저장해버렸다 - 방금 충전을 시작해 저장된 실제 데이터가 있어도, 새로고침 시점에 읽기가
    // 한 번만 삐끗하면 그 실제 데이터를 빈 상태로 덮어써서 영구히 날려버리는 구조적 문제였다.
    // v47: 그런데 v46 배포 후에도 "충전 시작 → 같은 링크를 새 탭으로 열어도 곧바로 빈 화면"이
    // 재현됨(에러 안내조차 없이) — 이는 get()이 예외를 던지는 게 아니라 "정상 응답 + 값 없음"을
    // 매번 일관되게 반환하고 있을 가능성을 시사함. v46은 이 "정상 응답 + 값 없음"을 재시도 없이
    // 곧바로 "진짜 첫 실행"으로 단정해 버렸는데, 이것도 성급한 판단일 수 있다 — 그래서 이제는
    // 예외로 인한 실패든 "값 없음" 응답이든 구분하지 않고 최대 3번까지 재시도해서 일시적인 지연을
    // 흡수하고, 그래도 3번 다 데이터를 못 찾으면 그때 가서야 "정말 없는 것"으로 보고 기본값을
    // 시딩하되 — 이번에는 그 사실을 배지로 눈에 띄게 남겨서, 만약 이게 반복적으로 잘못된 판단이라면
    // (즉 데이터가 실제로 있는데도 계속 못 찾는 근본적인 문제가 있다면) 사용자가 바로 알아챌 수 있게 함.
    diagLog('init-start', '화면을 새로 열거나 새로고침함');
    var loadedOK = false, lastErr = null, emptyCount = 0;
    for(var loadAttempt=0; loadAttempt<3 && !loadedOK; loadAttempt++){
      try{
        var result = await window.storage.get(STORAGE_KEY, true);
        if(result && result.value){
          state = normalizeState(JSON.parse(result.value));
          lastSavedJson = result.value;
          storageOK = true;
          loadedOK = true;
          diagLog('init-load-ok', (loadAttempt+1)+'회차 시도에서 기존 데이터 정상 로드(크기 '+result.value.length+'자)');
        } else {
          emptyCount++;
          diagLog('init-load-empty', (loadAttempt+1)+'회차 시도: 응답은 정상이나 값 없음');
          if(loadAttempt<2) await new Promise(function(r){ setTimeout(r, 400*(loadAttempt+1)); });
        }
      }catch(e){
        lastErr = e;
        diagLog('init-load-error', (loadAttempt+1)+'회차 시도: '+((e && (e.message||String(e)))||''));
        if(loadAttempt<2) await new Promise(function(r){ setTimeout(r, 400*(loadAttempt+1)); });
      }
    }
    if(loadedOK){
      lastSyncOK = true; lastSyncAt = Date.now(); lastSyncDetail = '';
    }
    if(!loadedOK){
      if(emptyCount>=3){
        // 3번 모두 "정상 응답인데 값 없음" - 진짜 첫 실행으로 보고 기본값을 시딩한다.
        // 다만 저장했던 데이터가 원인 불명으로 사라지는 사례가 있었으므로, 혹시 몰라 배지로도 남겨서
        // "어, 방금까지 있던 데이터가 없어졌네?" 싶은 순간 바로 확인할 수 있게 함.
        state = freshDefaultState();
        var seedJson = JSON.stringify(state);
        try{ await window.storage.set(STORAGE_KEY, seedJson, true); lastSavedJson = seedJson; storageOK = true; }
        catch(e2){ storageOK = false; }
        lastSyncOK = false; lastSyncAt = Date.now();
        lastSyncDetail = '저장소에서 기존 데이터를 찾지 못해 새로 초기화했습니다';
        updateSyncBadge();
        diagLog('init-seed-fresh', '3회 모두 빈 값 확인 - 새 기본값으로 초기화하고 저장 시도함');
      } else {
        // 예외(오류)와 "값 없음"이 섞여 나왔거나 예외만 발생한 경우 - 원인이 불확실하므로
        // 저장소는 절대 건드리지 않는다. 화면에는 임시로 빈 상태만 보여주고, 4초마다 도는
        // pollStorage()가 다음 성공적인 읽기에서 실제 데이터를 자동으로 되찾아온다.
        state = freshDefaultState();
        storageOK = false;
        lastSyncOK = false; lastSyncAt = Date.now();
        lastSyncDetail = (lastErr && (lastErr.message || String(lastErr))) || '데이터를 불러오지 못함';
        updateSyncBadge();
        diagLog('init-load-fail-ambiguous', '읽기 실패/불확실 - 저장소는 건드리지 않고 자동 재확인 대기');
        toast('데이터를 불러오지 못했습니다. 잠시 후 자동으로 다시 시도합니다.');
      }
    }
  } else {
    state = freshDefaultState();
    storageOK = false;
  }

  paint();
  document.body.addEventListener('click', onClick);
  document.body.addEventListener('submit', onSubmit); // 일부 환경에서 Enter키로 자연스럽게 폼 submit이 발생하는 경우를 위한 보조 처리
  document.body.addEventListener('change', onDocChange);
  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    var tag = e.target.tagName;
    if(tag!=='INPUT') return; // select/textarea 등에서는 Enter를 그대로 둠
    var form = e.target.form;
    if(!form) return;
    e.preventDefault();
    handleFormSubmit(form);
  });
  window.addEventListener('hashchange', paint);
  setInterval(pollStorage, 4000);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
